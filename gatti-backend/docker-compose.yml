version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gatti-postgres
    environment:
      POSTGRES_USER: gatti
      POSTGRES_PASSWORD: gatti_secure_password_123
      POSTGRES_DB: gatti_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatti"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gatti-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./gatti-backend
      dockerfile: Dockerfile
    container_name: gatti-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gatti:gatti_secure_password_123@postgres:5432/gatti_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-jwt-secret-key-change-in-production
      ZABBIX_API_URL: http://zabbix-api:8080/api_jsonrpc.php
      ZABBIX_API_USER: Admin
      ZABBIX_API_PASSWORD: zabbix
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gatti-network
    restart: unless-stopped

  frontend:
    build:
      context: ./gatti-frontend
      dockerfile: Dockerfile
    container_name: gatti-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001/api/v1
    depends_on:
      - backend
    networks:
      - gatti-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: gatti-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gatti-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  gatti-network:
    driver: bridge
